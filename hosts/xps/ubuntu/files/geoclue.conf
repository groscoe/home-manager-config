[agent]
whitelist=geoclue-demo-agent;gnome-shell;io.elementary.desktop.agent-geoclue2

[ip]
# BeaconDB's Wi-Fi endpoint can already fall back to an IP-based fix.
enable=false

[network-nmea]
enable=true

[3g]
enable=true

[cdma]
enable=true

[modem-gps]
enable=true

[wifi]
enable=true
url=https://api.beacondb.net/v1/geolocate
submit-data=false

[gnome-datetime-panel]
allowed=true
system=true
users=

[gnome-color-panel]
allowed=true
system=true
users=

[org.gnome.Shell]
allowed=true
system=true
users=

[io.elementary.desktop.agent-geoclue2]
allowed=true
system=true
users=

[epiphany]
allowed=true
system=false
users=

[firefox]
allowed=true
system=false
users=

[whereami]
allowed=true
system=false
users=1000
