# Route selection copies to the initiating client, even in a shared session.
# Keep native clipboard broadcasts disabled. Explicit load-buffer -w still works.
set -s set-clipboard off

# Mosh 1.4 accepts only the explicit CLIPBOARD selector, not tmux 3.6's empty one.
# Consume parameter 1 as a string without output; tmux requires both parameter types.
set -s terminal-overrides[90] 'xterm*:Ms=\E]52;%p1%.0sc;%p2%s\007'

# -P avoids a duplicate tmux buffer; -C prevents an all-clients OSC 52 broadcast.
bind -T copy-mode-vi y send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id}'
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id}'
bind -T copy-mode-vi C-j send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id}'
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id}'
bind -T copy-mode-vi D send -X copy-pipe-end-of-line-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id}'
bind -T copy-mode-vi A send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id} --append'
bind -T copy-mode-vi ! send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id} --no-newline'
bind -T copy-mode-vi Y send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id} --paste'
bind -T copy-mode-vi M-y send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id} --paste'

bind -T copy-mode y send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id}'
bind -T copy-mode M-w send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id}'
bind -T copy-mode C-w send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id}'
bind -T copy-mode MouseDragEnd1Pane send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id}'
bind -T copy-mode ! send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id} --no-newline'
bind -T copy-mode Y send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id} --paste'
bind -T copy-mode M-y send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id} --paste'

bind -T copy-mode-vi DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id}'
bind -T copy-mode-vi TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id}'
bind -T copy-mode DoubleClick1Pane select-pane \; send -X select-word \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id}'
bind -T copy-mode TripleClick1Pane select-pane \; send -X select-line \; run-shell -d 0.3 \; send -X copy-pipe-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id}'
bind -T copy-mode C-k send -X copy-pipe-end-of-line-and-cancel -CP '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id}'

# Repeat the latest copy without selecting it again. The existing prefix remains
# client-specific: ; over SSH and ç at the physical keyboard.
bind w run-shell -b '/usr/bin/python3 ~/.config/tmux/clipboard.py #{pid} #{q:socket_path} #{client_pid} #{q:client_name} #{pane_id} --buffer'
