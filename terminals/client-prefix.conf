# Per-client prefixes on Linux: SSH clients use ;, physical terminals use ç.
# This server option is a cache of client PIDs, not the shared session environment.
bind-key -T root \; if-shell -F '#{m:*|#{client_pid}|*,#{@xps-remote-clients}}' {
  switch-client -T prefix
} {
  send-keys -l \;
}
bind-key -T root ç if-shell -F '#{m:*|#{client_pid}|*,#{@xps-remote-clients}}' {
  send-keys -l ç
} {
  switch-client -T prefix
}

# Double the active prefix to type it. Preserve local prefix-; as last-pane.
bind-key -T prefix \; if-shell -F '#{m:*|#{client_pid}|*,#{@xps-remote-clients}}' {
  send-keys -l \;
} {
  last-pane
}
bind-key -T prefix ç send-keys -l ç
unbind-key C-b

# Prefix commands still work in either copy mode; inactive ; keeps jump-again.
bind-key -T copy-mode \; if-shell -F '#{m:*|#{client_pid}|*,#{@xps-remote-clients}}' {
  switch-client -T prefix
} {
  send-keys -X jump-again
}
bind-key -T copy-mode-vi \; if-shell -F '#{m:*|#{client_pid}|*,#{@xps-remote-clients}}' {
  switch-client -T prefix
} {
  send-keys -X jump-again
}
bind-key -T copy-mode ç if-shell -F '#{==:#{m:*|#{client_pid}|*,#{@xps-remote-clients}},0}' {
  switch-client -T prefix
}
bind-key -T copy-mode-vi ç if-shell -F '#{==:#{m:*|#{client_pid}|*,#{@xps-remote-clients}},0}' {
  switch-client -T prefix
}

# Indexed hooks are safe to reload and preserve other plugins' hooks.
set-hook -g client-attached[900] 'run-shell "/usr/bin/python3 ~/.config/tmux/client-prefix.py #{pid} #{q:socket_path}"'
set-hook -g after-new-session[900] 'run-shell "/usr/bin/python3 ~/.config/tmux/client-prefix.py #{pid} #{q:socket_path}"'
set-hook -g client-detached[900] 'run-shell "/usr/bin/python3 ~/.config/tmux/client-prefix.py #{pid} #{q:socket_path}"'
run-shell '/usr/bin/python3 ~/.config/tmux/client-prefix.py #{pid} #{q:socket_path} --initialize'
set-option -g prefix None
set-option -g prefix2 None
